<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aquifer — Home</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  :root{
    --bg:#0b1220; --card:#0f1730; --line:#1c2438; --muted:#9aa3c7; --text:#e6e8ee;
    --accent:#7aa6ff; --btn:#121a33; --btnh:#182247;
    font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text)}
  a{color:inherit;text-decoration:none}
  header{padding:16px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700;color:var(--accent)}
  .wrap{max-width:900px;margin:0 auto;padding:24px}
  .hero{border:1px solid var(--line);border-radius:16px;padding:20px;background:linear-gradient(145deg,#0e1630,#0b1326)}
  .hero h1{margin:0 0 8px}
  .muted{color:var(--muted)}
  .cta{display:inline-flex;gap:8px;align-items:center;margin-top:14px;padding:10px 14px;border:1px solid #34405d;border-radius:10px;background:var(--btn);cursor:pointer}
  .cta:hover{background:var(--btnh)}
  .card{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .card h2{margin:0 0 8px;font-size:18px}
  .md{line-height:1.6}
  .md pre{white-space:pre-wrap;word-break:break-word;background:#0b1220;border:1px solid #1c2438;border-radius:8px;padding:12px;overflow:auto}
</style>
</head>
<body>
  <header>
    <div class="brand">Aquifer</div>
    <nav><a class="cta" href="./catalog.html">Browse Catalog →</a></nav>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Aquifer</h1>
      <p class="muted">Open, structured Bible translation data & tooling for developers, linguists, and ministries.</p>
      <a class="cta" href="./catalog.html">Open the Unified Catalog →</a>
    </section>

    <section class="card">
      <h2>About the Aquifer</h2>
      <div id="readme" class="md">Loading…</div>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  // Pull the README from the Aquifer repo (adjust if your README lives elsewhere)
  const README_URL = 'https://github.com/BibleAquifer/.github/edit/main/profile/README.md';
  fetch(README_URL, {cache:'no-store'})
    .then(r => r.ok ? r.text() : Promise.reject(new Error('README not found')))
    .then(md => { document.getElementById('readme').innerHTML = marked.parse(md); })
    .catch(e => { document.getElementById('readme').textContent = 'Could not load README: ' + e.message; });
</script>
</body>
</html>
