name: Build unified catalog manifest

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/build_manifest.yml'
  schedule:
    - cron: '0 * * * *'  # hourly

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_OR_USER: BibleAquifer   # account to crawl
      INCLUDE_FORKS: "false"
      INCLUDE_ARCHIVED: "false"
      PER_PAGE: "100"
      MAX_PAGES: "10"
      # Optional back-compat list; detection works without this
      LANGUAGE_FOLDERS_JSON: '["eng","fra","hin","por"]'
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # allow rebase

      - name: Sync with remote main (avoid non-fast-forward)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main || (git rebase --abort && git reset --hard origin/main)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate manifest from account repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const https = require('https');

          const GH_TOKEN = process.env.GH_TOKEN;
          const ACCOUNT = process.env.ORG_OR_USER;
          const INCLUDE_FORKS = (process.env.INCLUDE_FORKS || 'false').toLowerCase() === 'true';
          const INCLUDE_ARCHIVED = (process.env.INCLUDE_ARCHIVED || 'false').toLowerCase() === 'true';
          const PER_PAGE = Math.max(1, parseInt(process.env.PER_PAGE || '100', 10));
          const MAX_PAGES = Math.max(1, parseInt(process.env.MAX_PAGES || '10', 10));
          const LANGUAGE_FOLDERS = new Set(JSON.parse(process.env.LANGUAGE_FOLDERS_JSON || '[]')); // optional

          const IGNORE = [
            /^README(\.md|\.txt)?$/i, /^LICENSE(\.md|\.txt)?$/i,
            /^\.github$/i, /^\.gitignore$/i, /^\.gitattributes$/i, /^\.DS_Store$/i,
            /^index(\.md|\.html)?$/i
          ];
          const LANG_DIR_RE = /^(?:[a-z]{2,4})(?:[-_][a-z0-9]{2,8})?$/i; // en, eng, por, en-US, zh-Hans, etc.

          function gh(path){
            const opts = {
              hostname: 'api.github.com',
              path,
              headers: {
                'User-Agent': 'aquifer-manifest-bot',
                'Authorization': `Bearer ${GH_TOKEN}`,
                'Accept': 'application/vnd.github+json'
              }
            };
            return new Promise((resolve, reject)=>{
              https.get(opts, res=>{
                let data=''; res.on('data', d=>data+=d);
                res.on('end', ()=>{
                  if(res.statusCode>=200 && res.statusCode<300){
                    try { resolve({json: JSON.parse(data), headers: res.headers}); } catch(e){ reject(e); }
                  } else {
                    reject(new Error(`GitHub ${res.statusCode}: ${data}`));
                  }
                });
              }).on('error', reject);
            });
          }

          async function listAllReposForAccount(account){
            const out = [];
            async function pull(base){
              for (let page=1; page<=MAX_PAGES; page++){
                const path = `${base}?per_page=${PER_PAGE}&page=${page}&type=public&sort=full_name`;
                const {json} = await gh(path);
                if (!Array.isArray(json) || json.length === 0) break;
                out.push(...json);
                if (json.length < PER_PAGE) break;
              }
            }
            try { await pull(`/orgs/${account}/repos`); }
            catch { await pull(`/users/${account}/repos`); }
            return out;
          }

          function isIgnored(name){ return IGNORE.some(re => re.test(name)); }
          function looksLikeLangDir(name){ return LANGUAGE_FOLDERS.has(name) || LANG_DIR_RE.test(name); }

          async function listDir(owner, repo, path='', ref){
            const enc = path ? `/${encodeURIComponent(path).replace(/%2F/g,'/')}` : '';
            const {json} = await gh(`/repos/${owner}/${repo}/contents${enc}?ref=${encodeURIComponent(ref)}`);
            return Array.isArray(json) ? json : [json];
          }

          async function walk(owner, repo, basePath, ref){
            const acc = [];
            async function recur(p){
              let items; try { items = await listDir(owner, repo, p, ref); } catch { return; }
              for (const it of items){
                if (it.type === 'dir') {
                  if (isIgnored(it.name)) continue;
                  await recur(it.path);
                } else if (it.type === 'file') {
                  if (isIgnored(it.name)) continue;
                  acc.push({
                    path: it.path,
                    size: it.size ?? null,
                    sha: it.sha ?? null,
                    downloadRaw: `https://raw.githubusercontent.com/${owner}/${repo}/${ref}/${it.path}`,
                    downloadCdn: `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${ref}/${it.path}`
                  });
                }
              }
            }
            await recur(basePath);
            return acc;
          }

          (async ()=>{
            const allRepos = await listAllReposForAccount(ACCOUNT);
            const repos = allRepos
              .filter(r => (INCLUDE_FORKS || !r.fork))
              .filter(r => (INCLUDE_ARCHIVED || !r.archived));

            const manifest = { generatedAt: new Date().toISOString(), account: ACCOUNT, repos: [] };

            for (const r of repos){
              const owner = r.owner.login;
              const repo = r.name;
              const ref = r.default_branch || 'main'; // <- use each repo's default branch

              // root listing
              let root=[];
              try { root = await listDir(owner, repo, '', ref); } catch { continue; }

              const languages = {};

              // 1) language dirs at root
              const langDirs = root.filter(x => x.type==='dir' && !isIgnored(x.name) && looksLikeLangDir(x.name)).map(x=>x.name);
              for (const ld of langDirs){
                try { languages[ld] = await walk(owner, repo, ld, ref); } catch {}
              }

              // 2) other top-level dirs into _datasets (keeps <dir>/... in path)
              const otherDirs = root.filter(x => x.type==='dir' && !isIgnored(x.name) && !langDirs.includes(x.name)).map(x=>x.name);
              if (otherDirs.length){
                languages['_datasets'] = languages['_datasets'] || [];
                for (const d of otherDirs){
                  try { languages['_datasets'].push(...await walk(owner, repo, d, ref)); } catch {}
                }
              }

              // 3) if nothing yet, include root files (as _datasets)
              if (!Object.keys(languages).length){
                const topFiles = root
                  .filter(x => x.type==='file' && !isIgnored(x.name))
                  .map(x => ({
                    path: x.path,
                    size: x.size ?? null,
                    sha: x.sha ?? null,
                    downloadRaw: `https://raw.githubusercontent.com/${owner}/${repo}/${ref}/${x.path}`,
                    downloadCdn: `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${ref}/${x.path}`
                  }));
                if (topFiles.length) languages['_datasets'] = topFiles;
              }

              const total = Object.values(languages).reduce((n, arr)=> n + (arr?.length||0), 0);
              if (total > 0){
                manifest.repos.push({ name: `${owner}/${repo}`, branch: ref, languages });
              }
            }

            fs.mkdirSync('docs/data', { recursive: true });
            fs.writeFileSync('docs/data/manifest.json', JSON.stringify(manifest, null, 2));
            console.log(`✅ wrote docs/data/manifest.json with ${manifest.repos.length} repos from ${ACCOUNT}`);
          })().catch(err=>{ console.error(err); process.exit(1); });
          NODE

      - name: Auto-commit manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update unified catalog manifest [skip ci]"
          file_pattern: docs/data/manifest.json
          # If your branch moves during the run, uncomment the next line:
          # push_options: '--force-with-lease'
